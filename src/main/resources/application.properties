# ================================
# Application
# ================================
spring.application.name=url-shortener
server.port=8080

# ================================
# MySQL Database
# ================================
spring.datasource.url=jdbc:mysql://localhost:3306/urlshortener_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=@kkuM0ni
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ================================
# Redis (for caching short URL lookups)
# ================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ================================
# App-specific config
# ================================
# Base URL used when returning the short link to the client
app.base-url=http://localhost:8080/

# Default expiry (in days) if user doesn't specify one
app.default-expiry-days=30

# Rate limiter config (token bucket)
app.ratelimit.capacity=10
app.ratelimit.refill-tokens=10
app.ratelimit.refill-duration-seconds=60
